<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent the HTML shell from being cached so chunk hashes always match the latest deploy. Hashed /assets/* files remain long-cached at the hosting layer. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>FINternship Learning Platform - Financial Advisory Training & Education</title>
    <meta name="description" content="Master financial advisory skills with comprehensive product training. Access investment, endowment, whole life, term, and medical insurance guides with AI assistance, videos, and expert resources." />
    <meta name="keywords" content="financial advisor training, insurance products, investment learning, AIA products, financial education, product knowledge, sales training" />
    <meta name="author" content="FINternship Learning Platform" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="FINternship Learning Platform" />
    <meta property="og:description" content="The training hub for FINternship advisers: the 14-day orientation, the first 60 days, AIA product lessons, CMFAS prep, sales scripts and roleplay." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://academy.finternship.com/" />
    <meta property="og:site_name" content="FINternship Learning Platform" />
    <meta property="og:image" content="https://academy.finternship.com/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FINternship Learning Platform" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@finternship" />
    <meta name="twitter:creator" content="@finternship" />
    <meta name="twitter:title" content="FINternship Learning Platform" />
    <meta name="twitter:description" content="The training hub for FINternship advisers: the 14-day orientation, the first 60 days, AIA product lessons, CMFAS prep, sales scripts and roleplay." />
    <meta name="twitter:image" content="https://academy.finternship.com/og/home.jpg" />
    <meta name="twitter:image:alt" content="FINternship Learning Platform" />
    
    <!-- Mobile Optimization -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FINternship" />
    
    <!-- Performance -->
    <link rel="preconnect" href="https://hgdbflprrficdoyxmdxe.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preload" href="/fonts/excalifont-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Fonts load async so they don't block first paint. display=swap lets
         text render in a system fallback, then switch when the webfont lands. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script defer src="/_vercel/insights/script.js"></script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
